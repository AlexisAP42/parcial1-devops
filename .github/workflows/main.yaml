name: Deploy to Surge

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Surge
        run: npx surge . parcial1-alexis.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}